name: Frontend Pages Deploy

on:
  push:
    branches: ["default", "copilot/**"]
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve worker URL
        id: worker-url
        env:
          WORKER_URL_SECRET: ${{ secrets.WORKER_URL }}
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
          BUCKET_ACCOUNT_ID: ${{ secrets.BUCKET_ACCOUNT_ID }}
        run: |
          if [ -n "$WORKER_URL_SECRET" ]; then
            echo "url=$WORKER_URL_SECRET" >> "$GITHUB_OUTPUT"
          elif [ -n "$CF_WORKER_NAME" ] && [ -n "$BUCKET_ACCOUNT_ID" ]; then
            echo "url=https://${CF_WORKER_NAME}.${BUCKET_ACCOUNT_ID}.workers.dev" >> "$GITHUB_OUTPUT"
          else
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend
        env:
          VITE_API_URL: ${{ steps.worker-url.outputs.url }}
        run: npm run build:frontend

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
