name: Backend CI

on:
  push:
    paths:
      - "server/**"
      - "frontend/**"
      - "api.json"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "frontend/**"
      - "api.json"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:server

      - name: Test
        run: npm test

      - name: Upload Server test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/test-report.junit.xml
          if-no-files-found: error

  test-report:
    if: always()
    needs:
      - server
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server report artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: server-test-report
          path: reports/server

      - name: Publish server test report
        uses: dorny/test-reporter@v1
        with:
          name: Server Tests
          path: reports/server/test-report.junit.xml
          reporter: java-junit
