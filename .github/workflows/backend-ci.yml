name: Backend CI

on:
  push:
    paths:
      - "server/**"
      - "api.json"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "api.json"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Generate CI Wrangler config from secrets
        working-directory: server
        env:
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
          CF_D1_DATABASE_NAME: ${{ secrets.CF_D1_DATABASE_NAME }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          R2_ACCESS_TOKEN: ${{ secrets.R2_ACCESS_TOKEN }}
        run: |
          cp wrangler.example.toml wrangler.toml
          sed -i "s/your-worker-name/${CF_WORKER_NAME:-serverlesstea-server-ci}/g" wrangler.toml
          sed -i "s/your-d1-database-name/${CF_D1_DATABASE_NAME:-serverlesstea-ci}/g" wrangler.toml
          sed -i "s/your-d1-database-id/${CF_D1_DATABASE_ID:-ci-d1-database-id}/g" wrangler.toml
          sed -i "s/your-r2-bucket-name/${CF_R2_BUCKET_NAME:-serverlesstea-ci-git}/g" wrangler.toml
          sed -i "s/replace-with-a-secret-value/${JWT_SECRET:-ci-jwt-secret}/g" wrangler.toml
          sed -i "s/replace-with-r2-access-token-if-needed/${R2_ACCESS_TOKEN:-ci-r2-access-token}/g" wrangler.toml

      - name: Build
        working-directory: server
        run: npm run build

      - name: Test
        working-directory: server
        run: npm test

      - name: Upload Server test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/test-report.junit.xml
          if-no-files-found: error

  test-report:
    if: always()
    needs:
      - server
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Download server report artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: server-test-report
          path: reports/server

      - name: Publish server test report
        uses: dorny/test-reporter@v1
        with:
          name: Server Tests
          path: reports/server/test-report.junit.xml
          reporter: java-junit
