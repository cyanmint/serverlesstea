name: Backend CI

on:
  push:
    paths:
      - "server/**"
      - "frontend/**"
      - "api.json"
      - "package.json"
      - "package-lock.json"
      - "wrangler.example.toml"
      - "config.example.js"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "frontend/**"
      - "api.json"
      - "package.json"
      - "package-lock.json"
      - "wrangler.example.toml"
      - "config.example.js"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate CI Wrangler config from secrets
        env:
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
          CF_D1_DATABASE_NAME: ${{ secrets.CF_D1_DATABASE_NAME }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          CF_R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          R2_ACCESS_TOKEN: ${{ secrets.R2_ACCESS_TOKEN }}
          BUCKET_ENDPOINT: ${{ secrets.BUCKET_ENDPOINT }}
          BUCKET_ACCOUNT_ID: ${{ secrets.BUCKET_ACCOUNT_ID }}
          BUCKET_TOKEN: ${{ secrets.BUCKET_TOKEN }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: npm run generate:wrangler-config

      - name: Build
        run: npm run build:server

      - name: Test
        env:
          BUCKET_ENDPOINT: ${{ secrets.BUCKET_ENDPOINT }}
          BUCKET_ACCOUNT_ID: ${{ secrets.BUCKET_ACCOUNT_ID }}
          BUCKET_TOKEN: ${{ secrets.BUCKET_TOKEN }}
        run: npm test

      - name: Upload Server test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/test-report.junit.xml
          if-no-files-found: error

  test-report:
    if: always()
    needs:
      - server
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server report artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: server-test-report
          path: reports/server

      - name: Publish server test report
        uses: dorny/test-reporter@v1
        with:
          name: Server Tests
          path: reports/server/test-report.junit.xml
          reporter: java-junit

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
      - server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BUCKET_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BUCKET_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
          CF_D1_DATABASE_NAME: ${{ secrets.CF_D1_DATABASE_NAME }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          CF_R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          R2_ACCESS_TOKEN: ${{ secrets.R2_ACCESS_TOKEN }}
          BUCKET_ENDPOINT: ${{ secrets.BUCKET_ENDPOINT }}
          BUCKET_ACCOUNT_ID: ${{ secrets.BUCKET_ACCOUNT_ID }}
          BUCKET_TOKEN: ${{ secrets.BUCKET_TOKEN }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: npm run setup && npm run deploy
