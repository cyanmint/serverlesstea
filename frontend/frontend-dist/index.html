<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gitea</title>
  <!--
    Standalone Gitea SPA — deployed to GitHub Pages (or any static host).

    By default the SPA talks to the Gitea API server whose URL was embedded at
    build time via the VITE_DEFAULT_API_URL environment variable.

    To point the frontend at a different server after deployment, open your
    browser DevTools console and run:

        localStorage.setItem('gitea-api-url', 'https://your-gitea-server.example.com')
        location.reload()
  -->

  <!--
    Initialise window.config with empty defaults for standalone mode.
    This mirrors what the Gitea Go template injects in embedded mode and must
    run synchronously before any ES modules are evaluated.
  -->
  <script>
    window.config = {
      appUrl: '',
      appSubUrl: '',
      assetUrlPrefix: '',
      sharedWorkerUri: '',
      runModeIsProd: true,
      customEmojis: {},
      pageData: {},
      notificationSettings: {MinTimeout: 10000, TimeoutStep: 10000, MaxTimeout: 300000, EventSourceUpdateTime: 10000},
      enableTimeTracking: false,
      mermaidMaxSourceCharacters: 5000,
      i18n: {},
      frontendInited: false,
    };
  </script>
  <script type="module" crossorigin src="./assets/index-CuTIQd1m.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B_ZicyNT.css">
</head>
<body>
  <div id="app"></div>
  <!-- spa-entry.ts imports the standalone CSS bundle (theme + Fomantic UI
       modules + Tailwind) before mounting the Vue app. Using a dedicated entry
       keeps CSS out of main.ts, which is also imported by the embedded build
       where the Go binary injects its own CSS. -->
</body>
</html>
